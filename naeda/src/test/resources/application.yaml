spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${TEST_POSTGRES_PORT}/${TEST_POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

ai:
  base-url: http://localhost:8000
  service-token: test-token

face:
  threshold:
    match: 0.7
    ambiguous: 0.65
  top-k: 3
  encrypt-key: ${FACE_ENCRYPT_KEY:}

ssafy:
  api:
    base-url: https://finopenapi.ssafy.io/ssafy/api/v1
    key: ${SSAFY_API_KEY:}

jwt:
  secret: ${JWT_SECRET:dGVzdC1zZWNyZXQta2V5LWZvci1uYWVkYS1wcm9qZWN0LTEyMzQ1Njc4OQ==}
  access-token-expiry: 3600000
  refresh-token-expiry: 604800000