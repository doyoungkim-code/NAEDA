spring:
  application:
    name: naeda
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

ai:
  base-url: ${AI_BASE_URL:http://localhost:8000}
  service-token: ${AI_SERVICE_TOKEN:dev-internal-token}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:5}

face:
  threshold: 0.7
  top-k: 3
