spring:
  application:
    name: naeda
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:naeda/.env[.properties]
  data:
    redis:
      host: localhost
      port: 6379
      password: redis1234!
  datasource:
      url: jdbc:postgresql://localhost:5432/naeda
      username: naedauser
      password: "naeda1234!"
      driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
          enable.idempotence: true
          max.in.flight.requests.per.connection: 1
      consumer:
          group-id: naeda-payment
          key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
          value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
          auto-offset-reset: earliest
          properties:
            spring.json.trusted.packages: "com.ssafy.naeda.domain.pay.dto.event"


ai:
  base-url: ${AI_BASE_URL:http://localhost:8000}
  service-token: ${AI_SERVICE_TOKEN:dev-internal-token}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:5}

face:
  threshold:
    match: 0.7
    ambiguous: 0.65
  top-k: 3
  max-image-bytes: 3145728
  encrypt-key: ${FACE_ENCRYPT_KEY:}

rba:
  high-amount: 50000

fds:
  version:
    feature: fds-feature-v1
    rule: fds-rule-v1

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method

ssafy:
  api:
    base-url: https://finopenapi.ssafy.io/ssafy/api/v1
    key: ${SSAFY_API_KEY:}

payment:
  point:
    rate: 0.05
  request:
    ttl-seconds: 30
    process-ttl-seconds: 300

jwt:
  secret: ${JWT_SECRET:naeda-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256}
  access-token-expiry: 1800000      # 30분 (밀리초)
  refresh-token-expiry: 604800000   # 7일 (밀리초)
