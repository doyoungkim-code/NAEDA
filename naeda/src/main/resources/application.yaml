spring:
  application:
    name: naeda
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:naeda/.env[.properties]
  data:
    redis:
      host: localhost
      port: 6379
      password: redis1234!
  datasource:
      url: jdbc:postgresql://localhost:5432/naeda
      username: naedauser
      password: "naeda1234!"
      driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true


ai:
  base-url: ${AI_BASE_URL:http://localhost:8000}
  service-token: ${AI_SERVICE_TOKEN:dev-internal-token}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:5}

face:
  threshold:
    match: 0.7
    ambiguous: 0.65
  top-k: 3
  encrypt-key: ${FACE_ENCRYPT_KEY:}

rba:
  high-amount: 50000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method

ssafy:
  api:
    base-url: https://finopenapi.ssafy.io/ssafy/api/v1
    key: ${SSAFY_API_KEY:}

jwt:
  secret: ${JWT_SECRET:naeda-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256}
  access-token-expiry: 1800000      # 30분 (밀리초)
  refresh-token-expiry: 604800000   # 7일 (밀리초)
